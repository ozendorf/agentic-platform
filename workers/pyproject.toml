[project]
name = "platform-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "temporalio>=1.18",
  "crewai[anthropic]>=1.0",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
]

[project.scripts]
worker = "platform_worker.worker:main"
migrate = "platform_worker.migrate:main"
seed = "platform_worker.seed:main"
start-sample = "platform_worker.start_sample:main"
mcp-add = "platform_worker.mcp_cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
